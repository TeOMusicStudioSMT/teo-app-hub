<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1320">
<link rel="icon" href="data:,">
<title>Świat Katedry</title>
<link rel="stylesheet" href="swiat.css">
<!-- three.js z mostu (node_modules/three, ta sama wersja co Games Studio) — bez CDN, działa offline. -->
<script type="importmap">{ "imports": { "three": "./three/build/three.module.min.js", "three/addons/": "./three/examples/jsm/" } }</script>
</head>
<body>
<canvas id="scena" aria-label="Świat klocków: płytki TeOgochi"></canvas>
<canvas id="scena3d" aria-label="Świat klocków w 3D"></canvas>

<header class="pasek">
  <div>
    <h1>Świat Katedry</h1>
    <p id="podpis">Łączę się z mostem…</p>
  </div>
  <div class="prawo">
    <span id="zywo" class="zywo">○ łączę…</span>
    <button id="tryb" class="tryb" type="button">3D</button>
  </div>
</header>

<p id="pusto" class="pusto" hidden></p>

<section id="katalog" class="katalog" hidden aria-live="polite">
  <button id="zamknij" class="zamknij" aria-label="Zamknij katalog">✕</button>
  <div id="katalog-tresc"></div>
</section>

<script src="swiat.js"></script>
</body>
</html>
