<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>QUANTUM CANVAS — Katedra OtakOS</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --gold:   #c9953a;
    --gold-l: #f0c060;
    --gold-d: #7a5a1a;
    --void:   #06080f;
    --ink:    #e8dfc8;
    --cyan:   #00e5ff;
    --purple: #a78bfa;
    --panel:  rgba(8,6,18,0.96);
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  body {
    background: var(--void);
    color: var(--ink);
    font-family: 'Share Tech Mono', monospace;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
  }

  /* ── Header ── */
  #header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 16px;
    background: rgba(6,8,15,0.95);
    border-bottom: 1px solid rgba(201,149,58,0.2);
    z-index: 50;
    flex-shrink: 0;
  }

  #title-block { display: flex; flex-direction: column; }
  #eyebrow { font-size: 8px; letter-spacing: 0.35em; color: var(--gold-d); }
  #app-title {
    font-family: 'Cinzel', serif;
    font-size: 16px; font-weight: 600;
    color: var(--gold-l);
    letter-spacing: 0.08em;
  }

  #player-badge {
    display: flex; align-items: center; gap: 6px;
    background: rgba(0,229,255,0.08);
    border: 1px solid rgba(0,229,255,0.2);
    border-radius: 20px;
    padding: 4px 10px;
    font-size: 10px; letter-spacing: 0.15em;
    color: var(--cyan);
  }

  .player-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    animation: pulse-dot 2s ease-in-out infinite;
  }

  @keyframes pulse-dot {
    0%,100% { opacity:1; }
    50%      { opacity:0.4; }
  }

  /* ── Toolbar ── */
  #toolbar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    background: rgba(6,8,15,0.92);
    border-bottom: 1px solid rgba(255,255,255,0.05);
    flex-wrap: wrap;
    z-index: 40;
    flex-shrink: 0;
  }

  .tool-group {
    display: flex;
    align-items: center;
    gap: 4px;
    padding-right: 10px;
    border-right: 1px solid rgba(255,255,255,0.07);
  }

  .tool-group:last-child { border-right: none; }

  .tool-btn {
    width: 34px; height: 34px;
    border-radius: 8px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.5);
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    position: relative;
  }

  .tool-btn:hover { background: rgba(255,255,255,0.08); color: #fff; }
  .tool-btn.active {
    background: rgba(201,149,58,0.2);
    border-color: rgba(201,149,58,0.5);
    color: var(--gold-l);
    box-shadow: 0 0 10px rgba(201,149,58,0.2);
  }

  .tool-btn.cyan-active {
    background: rgba(0,229,255,0.15);
    border-color: rgba(0,229,255,0.4);
    color: var(--cyan);
  }

  /* Size slider */
  #size-slider {
    -webkit-appearance: none;
    width: 80px; height: 3px;
    background: rgba(255,255,255,0.15);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }

  #size-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--gold);
    cursor: pointer;
    box-shadow: 0 0 8px rgba(201,149,58,0.4);
  }

  #size-val {
    font-size: 10px; color: rgba(255,255,255,0.4);
    min-width: 24px; text-align: center;
  }

  /* Opacity slider */
  #opacity-slider {
    -webkit-appearance: none;
    width: 60px; height: 3px;
    background: rgba(255,255,255,0.15);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }

  #opacity-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--purple);
    cursor: pointer;
  }

  /* Color swatches */
  #color-row {
    display: flex; gap: 5px; align-items: center;
  }

  .swatch {
    width: 22px; height: 22px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.15s;
    flex-shrink: 0;
  }

  .swatch:hover { transform: scale(1.15); }
  .swatch.active { border-color: #fff; box-shadow: 0 0 8px rgba(255,255,255,0.4); }

  #custom-color {
    width: 22px; height: 22px;
    border-radius: 50%;
    padding: 0; border: 2px solid rgba(255,255,255,0.2);
    cursor: pointer; overflow: hidden;
    background: transparent;
  }

  /* Canvas area */
  #canvas-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
    cursor: crosshair;
  }

  #main-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  /* Cursor preview */
  #cursor-preview {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    border: 1px solid rgba(255,255,255,0.4);
    transform: translate(-50%, -50%);
    z-index: 10;
    transition: width 0.1s, height 0.1s;
  }

  /* Remote cursors */
  .remote-cursor {
    position: absolute;
    pointer-events: none;
    z-index: 20;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }

  .remote-cursor-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    border: 2px solid #fff;
  }

  .remote-cursor-name {
    font-size: 9px;
    background: rgba(0,0,0,0.7);
    padding: 1px 5px;
    border-radius: 4px;
    white-space: nowrap;
    letter-spacing: 0.1em;
  }

  /* Gallery overlay */
  #gallery {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    z-index: 100;
    flex-direction: column;
    backdrop-filter: blur(10px);
  }

  #gallery.open { display: flex; }

  #gallery-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid rgba(201,149,58,0.2);
    flex-shrink: 0;
  }

  #gallery-title {
    font-family: 'Cinzel', serif;
    font-size: 18px; color: var(--gold-l);
    letter-spacing: 0.1em;
  }

  #gallery-close {
    background: none; border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px; padding: 6px 14px;
    color: rgba(255,255,255,0.5);
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px; cursor: pointer;
    letter-spacing: 0.1em;
  }

  #gallery-grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 12px;
    padding: 20px;
    overflow-y: auto;
  }

  .gallery-item {
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.1);
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
  }

  .gallery-item:hover {
    border-color: var(--gold);
    transform: scale(1.02);
  }

  .gallery-item img {
    width: 100%; aspect-ratio: 16/9;
    object-fit: cover;
    display: block;
  }

  .gallery-item-meta {
    padding: 8px 10px;
    background: rgba(255,255,255,0.04);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .gallery-item-date {
    font-size: 9px; color: rgba(255,255,255,0.35);
    letter-spacing: 0.1em;
  }

  .gallery-item-del {
    background: none; border: none;
    color: rgba(255,255,255,0.2);
    cursor: pointer; font-size: 12px;
    padding: 0 4px;
  }

  .gallery-empty {
    grid-column: 1/-1;
    text-align: center;
    padding: 60px 20px;
    font-size: 12px;
    color: rgba(255,255,255,0.2);
    letter-spacing: 0.15em;
  }

  /* Toast */
  #toast {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%);
    z-index: 200;
    background: rgba(10,8,20,0.97);
    border: 1px solid rgba(201,149,58,0.3);
    border-radius: 8px;
    padding: 8px 18px;
    font-size: 11px; color: var(--gold-l);
    letter-spacing: 0.1em;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    white-space: nowrap;
  }

  #toast.show { opacity: 1; }

  /* Smudge cursor */
  body.smudge-mode { cursor: cell; }

  @media (max-width: 600px) {
    #size-slider { width: 60px; }
    #opacity-slider { width: 50px; }
    .tool-btn { width: 30px; height: 30px; }
  }
</style>
</head>
<body>

<div id="toast"></div>

<!-- Gallery -->
<div id="gallery">
  <div id="gallery-header">
    <span id="gallery-title">✦ Galeria Dzieł</span>
    <button id="gallery-close" onclick="closeGallery()">ZAMKNIJ</button>
  </div>
  <div id="gallery-grid"></div>
</div>

<!-- Header -->
<div id="header">
  <div id="title-block">
    <span id="eyebrow">∴ KATEDRA OTAKOS ∴</span>
    <span id="app-title">QUANTUM CANVAS</span>
  </div>
  <div id="player-badge">
    <div class="player-dot" style="background:#c9953a"></div>
    <span id="player-count">1 Twórca</span>
  </div>
</div>

<!-- Toolbar -->
<div id="toolbar">

  <!-- Tools -->
  <div class="tool-group">
    <button class="tool-btn active" id="btn-brush" onclick="setTool('brush')" title="Pędzel">🖌</button>
    <button class="tool-btn" id="btn-smudge" onclick="setTool('smudge')" title="Rozmazywanie / Mieszanie">💧</button>
    <button class="tool-btn" id="btn-eraser" onclick="setTool('eraser')" title="Gumka">◻</button>
  </div>

  <!-- Brush size -->
  <div class="tool-group" style="gap:6px">
    <span style="font-size:9px;color:rgba(255,255,255,0.3);letter-spacing:0.15em">⊙</span>
    <input type="range" id="size-slider" min="2" max="80" value="12"
           oninput="updateSize(this.value)">
    <span id="size-val">12</span>
  </div>

  <!-- Opacity -->
  <div class="tool-group" style="gap:6px">
    <span style="font-size:9px;color:rgba(255,255,255,0.3)">α</span>
    <input type="range" id="opacity-slider" min="5" max="100" value="85"
           oninput="updateOpacity(this.value)">
  </div>

  <!-- Colors -->
  <div class="tool-group">
    <div id="color-row"></div>
    <input type="color" id="custom-color" value="#c9953a"
           onchange="setCustomColor(this.value)" title="Własny kolor">
  </div>

  <!-- Actions -->
  <div class="tool-group">
    <button class="tool-btn" onclick="clearCanvas()" title="Wyczyść płótno">✕</button>
    <button class="tool-btn" onclick="saveWork()" title="Zapisz do galerii">💾</button>
    <button class="tool-btn" onclick="downloadCanvas()" title="Pobierz PNG">⬇</button>
    <button class="tool-btn" onclick="openGallery()" title="Galeria dzieł">🖼</button>
  </div>

</div>

<!-- Canvas -->
<div id="canvas-wrap">
  <canvas id="main-canvas"></canvas>
  <div id="cursor-preview"></div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────
let tool = 'brush';
let brushSize = 12;
let brushOpacity = 0.85;
let brushColor = '#c9953a';
let isDrawing = false;
let lastX = 0, lastY = 0;
let gallery = JSON.parse(localStorage.getItem('qc_gallery') || '[]');
let playerName = 'Suweren';

// Smudge buffer
let smudgeBuffer = null;

// ── Paleta kolorów ─────────────────────────────────────────────────
const PALETTE = [
  '#c9953a', '#f0c060', '#00e5ff', '#a78bfa',
  '#4ade80', '#f87171', '#fb923c', '#ffffff',
  '#e8dfc8', '#06080f',
];

// ── Canvas setup ───────────────────────────────────────────────────
const canvas = document.getElementById('main-canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const wrap = document.getElementById('canvas-wrap');
const cursorEl = document.getElementById('cursor-preview');

function resizeCanvas() {
  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  canvas.width  = wrap.offsetWidth;
  canvas.height = wrap.offsetHeight;
  // Ciemne tło kosmiczne
  ctx.fillStyle = '#06080f';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.putImageData(imageData, 0, 0);
}

function initCanvas() {
  canvas.width  = wrap.offsetWidth;
  canvas.height = wrap.offsetHeight;
  ctx.fillStyle = '#06080f';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  // Subtelne gwiazdy w tle
  ctx.fillStyle = 'rgba(232,223,200,0.15)';
  for (let i = 0; i < 120; i++) {
    const x = Math.random() * canvas.width;
    const y = Math.random() * canvas.height;
    const r = Math.random() * 1.2;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
}

window.addEventListener('resize', () => {
  const tmp = canvas.toDataURL();
  resizeCanvas();
  const img = new Image();
  img.onload = () => ctx.drawImage(img, 0, 0);
  img.src = tmp;
});

// ── Paleta UI ──────────────────────────────────────────────────────
function buildPalette() {
  const row = document.getElementById('color-row');
  PALETTE.forEach(c => {
    const s = document.createElement('div');
    s.className = 'swatch' + (c === brushColor ? ' active' : '');
    s.style.background = c;
    s.style.border = c === '#06080f' ? '2px solid rgba(255,255,255,0.2)' : '2px solid transparent';
    s.onclick = () => {
      brushColor = c;
      document.querySelectorAll('.swatch').forEach(x => x.classList.remove('active'));
      s.classList.add('active');
      document.getElementById('custom-color').value = c;
      updateCursorColor();
    };
    row.appendChild(s);
  });
}

function setCustomColor(c) {
  brushColor = c;
  document.querySelectorAll('.swatch').forEach(x => x.classList.remove('active'));
  updateCursorColor();
}

// ── Tool ───────────────────────────────────────────────────────────
function setTool(t) {
  tool = t;
  document.querySelectorAll('.tool-btn[id^=btn-]').forEach(b => b.classList.remove('active', 'cyan-active'));
  const btn = document.getElementById('btn-' + t);
  if (t === 'smudge') btn.classList.add('cyan-active');
  else btn.classList.add('active');
  document.body.classList.toggle('smudge-mode', t === 'smudge');
  canvas.style.cursor = t === 'eraser' ? 'cell' : t === 'smudge' ? 'crosshair' : 'none';
  cursorEl.style.display = (t === 'brush') ? 'block' : 'none';
}

function updateSize(v) {
  brushSize = parseInt(v);
  document.getElementById('size-val').textContent = v;
  updateCursorSize();
}

function updateOpacity(v) {
  brushOpacity = v / 100;
}

function updateCursorSize() {
  cursorEl.style.width  = brushSize + 'px';
  cursorEl.style.height = brushSize + 'px';
}

function updateCursorColor() {
  cursorEl.style.borderColor = brushColor;
}

// ── Drawing ────────────────────────────────────────────────────────
function getPos(e) {
  const r = canvas.getBoundingClientRect();
  const src = e.touches ? e.touches[0] : e;
  return {
    x: (src.clientX - r.left) * (canvas.width  / r.width),
    y: (src.clientY - r.top)  * (canvas.height / r.height),
  };
}

function startDraw(e) {
  e.preventDefault();
  isDrawing = true;
  const {x, y} = getPos(e);
  lastX = x; lastY = y;
  if (tool === 'brush' || tool === 'eraser') {
    ctx.beginPath();
    ctx.moveTo(x, y);
    drawDot(x, y);
  }
}

function drawDot(x, y) {
  ctx.save();
  if (tool === 'eraser') {
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0,0,0,1)';
  } else {
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = hexToRgba(brushColor, brushOpacity);
  }
  ctx.beginPath();
  ctx.arc(x, y, brushSize/2, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function draw(e) {
  e.preventDefault();
  if (!isDrawing) return;
  const {x, y} = getPos(e);

  // Kursor podgląd
  cursorEl.style.left = (x / (canvas.width  / wrap.offsetWidth))  + 'px';
  cursorEl.style.top  = (y / (canvas.height / wrap.offsetHeight)) + 'px';

  if (tool === 'brush' || tool === 'eraser') {
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineWidth = brushSize;
    if (tool === 'eraser') {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.strokeStyle = 'rgba(0,0,0,1)';
    } else {
      ctx.globalCompositeOperation = 'source-over';
      ctx.strokeStyle = hexToRgba(brushColor, brushOpacity);
    }
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(x, y);
    ctx.stroke();
    ctx.restore();
  }

  if (tool === 'smudge') {
    smudge(lastX, lastY, x, y);
  }

  lastX = x; lastY = y;
}

function stopDraw(e) {
  isDrawing = false;
  ctx.beginPath();
}

// ── Smudge / Rozmazywanie ──────────────────────────────────────────
function smudge(x1, y1, x2, y2) {
  const r = Math.floor(brushSize / 2);
  const steps = Math.ceil(Math.hypot(x2-x1, y2-y1) / 2) + 1;

  for (let i = 0; i < steps; i++) {
    const t = steps === 1 ? 0 : i / (steps - 1);
    const cx = x1 + (x2-x1)*t;
    const cy = y1 + (y2-y1)*t;
    const dx = x2 - x1;
    const dy = y2 - y1;

    // Pobierz piksel źródłowy
    const sx = Math.max(0, Math.min(canvas.width-1,  Math.floor(cx - dx*0.3)));
    const sy = Math.max(0, Math.min(canvas.height-1, Math.floor(cy - dy*0.3)));

    try {
      const srcData = ctx.getImageData(sx - r, sy - r, r*2, r*2);
      ctx.putImageData(srcData, cx - r, cy - r);
    } catch(e) { /* edge */ }
  }
}

// ── Helpers ────────────────────────────────────────────────────────
function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function clearCanvas() {
  ctx.fillStyle = '#06080f';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  // Przywróć gwiazdy
  ctx.fillStyle = 'rgba(232,223,200,0.12)';
  for (let i = 0; i < 120; i++) {
    ctx.beginPath();
    ctx.arc(Math.random()*canvas.width, Math.random()*canvas.height, Math.random()*1.2, 0, Math.PI*2);
    ctx.fill();
  }
  toast('✕ Płótno wyczyszczone');
}

// ── Zapisywanie ────────────────────────────────────────────────────
function saveWork() {
  const dataUrl = canvas.toDataURL('image/png');
  const item = {
    id: Date.now(),
    url: dataUrl,
    date: new Date().toLocaleString('pl-PL', {
      day: '2-digit', month: '2-digit',
      hour: '2-digit', minute: '2-digit'
    }),
  };
  gallery.unshift(item);
  if (gallery.length > 30) gallery = gallery.slice(0, 30); // max 30 dzieł
  localStorage.setItem('qc_gallery', JSON.stringify(gallery));
  toast('💾 Dzieło zapisane do Galerii!');
}

function downloadCanvas() {
  const link = document.createElement('a');
  link.download = `QuantumCanvas_${Date.now()}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
  toast('⬇ Pobrano PNG');
}

// ── Galeria ────────────────────────────────────────────────────────
function openGallery() {
  renderGallery();
  document.getElementById('gallery').classList.add('open');
}

function closeGallery() {
  document.getElementById('gallery').classList.remove('open');
}

function renderGallery() {
  const grid = document.getElementById('gallery-grid');
  grid.innerHTML = '';
  if (gallery.length === 0) {
    grid.innerHTML = '<div class="gallery-empty">Galeria pusta — namaluj coś i zapisz!</div>';
    return;
  }
  gallery.forEach((item, i) => {
    const el = document.createElement('div');
    el.className = 'gallery-item';
    el.innerHTML = `
      <img src="${item.url}" alt="Dzieło ${i+1}" loading="lazy">
      <div class="gallery-item-meta">
        <span class="gallery-item-date">${item.date}</span>
        <button class="gallery-item-del" onclick="deleteWork(${item.id}, event)" title="Usuń">✕</button>
      </div>
    `;
    el.querySelector('img').onclick = () => loadWork(item.url);
    grid.appendChild(el);
  });
}

function loadWork(url) {
  closeGallery();
  const img = new Image();
  img.onload = () => {
    ctx.fillStyle = '#06080f';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  };
  img.src = url;
  toast('✦ Dzieło załadowane na płótno');
}

function deleteWork(id, e) {
  e.stopPropagation();
  gallery = gallery.filter(x => x.id !== id);
  localStorage.setItem('qc_gallery', JSON.stringify(gallery));
  renderGallery();
}

// ── Toast ──────────────────────────────────────────────────────────
function toast(msg, dur=2200) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), dur);
}

// ── Simulated co-op (BroadcastChannel) ────────────────────────────
// Gdy drugi Otakonauta otworzy tę samą stronę w tej samej przeglądarce
// lub przez Dispatch — widać jego kursor i pociągnięcia
let bc;
try {
  bc = new BroadcastChannel('quantum_canvas');
  
  bc.onmessage = (e) => {
    const d = e.data;
    if (d.type === 'stroke') {
      // Rysuj pociągnięcie zdalnego gracza
      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineWidth = d.size;
      ctx.strokeStyle = hexToRgba(d.color, d.opacity * 0.8);
      ctx.beginPath();
      ctx.moveTo(d.x1, d.y1);
      ctx.lineTo(d.x2, d.y2);
      ctx.stroke();
      ctx.restore();
      showRemoteCursor(d.name, d.color, d.x2, d.y2);
    }
    if (d.type === 'join') {
      toast(`✦ ${d.name} dołączył do płótna`);
      updatePlayerCount(d.count || 2);
    }
  };

  // Zgłoś dołączenie
  bc.postMessage({ type: 'join', name: playerName, count: 2 });

} catch(e) { /* BroadcastChannel niedostępny */ }

function broadcastStroke(x1, y1, x2, y2) {
  if (!bc) return;
  try {
    bc.postMessage({
      type: 'stroke',
      name: playerName,
      color: brushColor,
      size: brushSize,
      opacity: brushOpacity,
      x1, y1, x2, y2,
    });
  } catch(e) {}
}

const remoteCursors = {};
function showRemoteCursor(name, color, x, y) {
  let el = remoteCursors[name];
  if (!el) {
    el = document.createElement('div');
    el.className = 'remote-cursor';
    el.innerHTML = `
      <div class="remote-cursor-dot" style="background:${color}"></div>
      <div class="remote-cursor-name" style="color:${color}">${name}</div>
    `;
    wrap.appendChild(el);
    remoteCursors[name] = el;
  }
  el.style.left = (x / (canvas.width / wrap.offsetWidth)) + 'px';
  el.style.top  = (y / (canvas.height / wrap.offsetHeight)) + 'px';
}

function updatePlayerCount(n) {
  document.getElementById('player-count').textContent = `${n} Twórców`;
}

// ── Broadcast strokes przy rysowaniu ──────────────────────────────
const origDraw = draw;
canvas.addEventListener('mousemove', (e) => {
  const {x, y} = getPos(e);
  // Kursor podgląd zawsze
  const rw = wrap.offsetWidth / canvas.width;
  const rh = wrap.offsetHeight / canvas.height;
  cursorEl.style.left = (x * rw) + 'px';
  cursorEl.style.top  = (y * rh) + 'px';
  if (isDrawing && tool === 'brush') {
    broadcastStroke(lastX, lastY, x, y);
  }
});

// ── Event listeners ────────────────────────────────────────────────
canvas.addEventListener('mousedown',  startDraw, {passive:false});
canvas.addEventListener('mousemove',  draw,      {passive:false});
canvas.addEventListener('mouseup',    stopDraw);
canvas.addEventListener('mouseleave', stopDraw);

canvas.addEventListener('touchstart', startDraw, {passive:false});
canvas.addEventListener('touchmove',  draw,      {passive:false});
canvas.addEventListener('touchend',   stopDraw);

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.key === 'b' || e.key === 'B') setTool('brush');
  if (e.key === 's' || e.key === 'S') setTool('smudge');
  if (e.key === 'e' || e.key === 'E') setTool('eraser');
  if (e.key === 'Delete' && e.ctrlKey) clearCanvas();
  if (e.key === 'g' || e.key === 'G') { e.preventDefault(); openGallery(); }
  if ((e.key === 's' && e.ctrlKey) || (e.key === 'S' && e.ctrlKey)) { e.preventDefault(); saveWork(); }
  // +/- dla rozmiaru
  if (e.key === '+' || e.key === '=') {
    brushSize = Math.min(80, brushSize + 2);
    document.getElementById('size-slider').value = brushSize;
    document.getElementById('size-val').textContent = brushSize;
    updateCursorSize();
  }
  if (e.key === '-') {
    brushSize = Math.max(2, brushSize - 2);
    document.getElementById('size-slider').value = brushSize;
    document.getElementById('size-val').textContent = brushSize;
    updateCursorSize();
  }
});

// ── Init ───────────────────────────────────────────────────────────
buildPalette();
initCanvas();
setTool('brush');
updateCursorSize();
updateCursorColor();

// Skróty klawiszowe info
setTimeout(() => toast('B=pędzel  S=rozmazuj  E=gumka  G=galeria'), 800);
</script>
